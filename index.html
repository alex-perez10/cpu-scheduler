<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            gap: 2rem;
        }

        .header {
            display: flex;
            align-items: center;
            background-color: #1C1C1E;
            padding: 1rem 1.5 rem;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: white;

        }

        .header p {
            font-size: 13px;
            color:888;
            margin-top: 2px;
        }

        .process-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px 32px;
            background-color: #1C1C1E;
            border-radius: 10px;
        }

        .top-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .algorithm-section {
            background-color: #1C1C1E;
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .algorithm-section input[type="radio"] {
            display: none;
        }

        .algorithm-section label {
            display: block;
            padding: 10px 14px;
            background-color: #2C2C2E;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: white;
        }
        .algorithm-section input[type="radio"]:checked + label {
            background-color: #C9F22C;
            color: #000000;
        }
        
        .algo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .quantum-input label {
            background: none !important;
            padding: 0 !important;
            font-size: 12px;
            color: #888;
            display: inline !important;
        }

        .table-section,
        .gantt-chart,
        .process-result {
            background-color: #1C1C1E;
            border-radius: 12px;
            padding:  1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            padding: 10px 20px;
            background-color: #2C2C2E;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 14px;
            width: 100%;
        }
         input::placeholder {
                color: #C9F22C;
                opacity: 0.6;
            } 

        .field label {
            font-size: 12px;
            color: 888;
        }

        #process-add-btn {
            background-color: #C9F22C;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 14px;
            width: 100%;
        }

        #run-btn {
            background-color: #C9F22C;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            width:100%;
        }

    </style>

</head>

<body>
    <div class="container">
        <!-- Header-->
        <div class="header">
            <div>
                <h1>CPU Scheduling Simulator</h1>
                <p id = "process-count"> 0 processes loaded</p>
            </div>
        </div>

        <!-- Top Panels-->
        <div class="top-panels">

             <!-- Algorithm Selector Section-->

        <div class="algorithm-section">
            <h2>Algorithm</h2>
            <div class="algo-grid">
            <input type="radio" id="FCFS" name="algorithm" value="FCFS">
            <label for="FCFS">FCFS</label>
            <input type="radio" id="SJF" name="algorithm" value="SJF">
            <label for="SJF">SJF</label>
            <input type="radio" id="round-robin" name="algorithm" value="round-robin">
            <label for="round-robin">Round robin</label>
            <input type="radio" id="Priority" name="algorithm" value="Priority">
            <label for="Priority">Priority</label>
            </div>
            <div class="quantum-input">
                <label for="quantum">Quantum</label>
                <input type="number" id="quantum" placeholder="2" />
            </div>
            <button id="run-btn">Run</button>
        </div>

            <!-- Process Section-->
            <div class="process-section">
                <h2> Add a process</h2>
                <div class="field">
                    <label for="process-name">Name of process</label>
                    <input type="text" id="process-name" placeholder="P1" />
                </div>
                <div class="field">
                    <label for="arrival-time">Arrival time</label>
                    <input type="number" id="arrival-time" placeholder="0" />
                </div>
                <div class="field">
                    <label for="burst-time">Burst time</label>
                    <input type="number" id="burst-time" placeholder="1" />
                </div>
                <div class="field">
                    <label for="priority">Priority</label>
                    <input type="number" id="priority" placeholder="1" />
                </div>
                <button id="process-add-btn">Click to add process</button>
            </div>
        </div>

             <!-- Table Queue Section-->
        <div class="table-section">
            <h2>Process queue</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name of process</th>
                        <th>Arrival time</th>
                        <th>Burst time</th>
                        <th>Priority</th>
                    </tr>
                </thead>
                <tbody id="process-tbody">
                </tbody>
            </table>
        </div>


        <!-- Gantt Chart Section-->
        <div class="gantt-chart">
            <h2>Gannt chart</h2>
            <div class="final-gantt" id="final-gantt">

            </div>
        </div>

        <!-- Process Result Section-->
        <div class="process-result">
            <h2>Process results</h2>
            <table>
                <thead>
                    <tr>
                        <th>Process</th>
                        <th>Burst</th>
                        <th>Arrival</th>
                        <th>Start</th>
                        <th>Finish</th>
                        <th>Waiting</th>
                        <th>Turnaround</th>
                    </tr>
                </thead>
                <tbody id="process-result-tbody">

                </tbody>
            </table>
        </div>


    </div>
</body>

</html>
