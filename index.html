<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            gap: 2rem;
        }

        .header {
            display: flex;
            align-items: center;
            background-color: #1C1C1E;
            padding: 1rem 1.5rem;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: white;

        }

        .header p {
            font-size: 13px;
            color: #AEAEB2;
            margin-top: 2px;
        }

        .process-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px 32px;
            background-color: #1C1C1E;
            border-radius: 10px;
        }

        .top-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .algorithm-section {
            background-color: #1C1C1E;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .algorithm-section input[type="radio"] {
            display: none;
        }

        .algorithm-section label {
            display: block;
            padding: 10px 14px;
            background-color: #2C2C2E;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: white;
        }

        .algorithm-section input[type="radio"]:checked+label {
            background-color: #C9F22C;
            color: #000000;
        }

        .algo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .quantum-input label {
            background: none !important;
            padding: 0 !important;
            font-size: 12px;
            color: #AEAEB2;
            display: inline !important;
        }

        .table-section,
        .gantt-chart,
        .process-result {
            background-color: #1C1C1E;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .gantt-bars {
            display: flex;
            width: 100%;
        }

        .gantt-ticks {
            display: flex;
            width: 100%;
            margin-top: 4px;
        }

        .gantt-bars {
            height : 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            min-width:40px;
        }

        input {
            padding: 10px 20px;
            background-color: #2C2C2E;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 14px;
            width: 100%;
        }

        input::placeholder {
            color: #C9F22C;
            opacity: 0.6;
        }

        .field label {
            font-size: 12px;
            color: #AEAEB2;
        }

        #process-add-btn {
            background-color: #C9F22C;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 14px;
            width: 100%;
        }

        #run-btn {
            background-color: #C9F22C;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
        }
    </style>

</head>

<body>
    <div class="container">
        <!-- Header-->
        <div class="header">
            <div>
                <h1>CPU Scheduling Simulator</h1>
                <p id="process-count"> 0 processes loaded</p>
            </div>
        </div>

        <!-- Top Panels-->
        <div class="top-panels">

            <!-- Algorithm Selector Section-->

            <div class="algorithm-section">
                <h2>Algorithm</h2>
                <div class="algo-grid">
                    <input type="radio" id="FCFS" name="algorithm" value="FCFS">
                    <label for="FCFS">FCFS</label>
                    <input type="radio" id="SJF" name="algorithm" value="SJF">
                    <label for="SJF">SJF</label>
                    <input type="radio" id="round-robin" name="algorithm" value="round-robin">
                    <label for="round-robin">Round robin</label>
                    <input type="radio" id="Priority" name="algorithm" value="Priority">
                    <label for="Priority">Priority</label>
                </div>
                <div class="quantum-input">
                    <label for="quantum">Quantum</label>
                    <input type="number" id="quantum" placeholder="2" />
                </div>
                <button id="run-btn">Run</button>
            </div>

            <!-- Process Section-->
            <div class="process-section">
                <h2> Add a process</h2>
                <div class="field">
                    <label for="process-name">Name of process</label>
                    <input type="text" id="process-name" placeholder="P1" />
                </div>
                <div class="field">
                    <label for="arrival-time">Arrival time</label>
                    <input type="number" id="arrival-time" placeholder="0" />
                </div>
                <div class="field">
                    <label for="burst-time">Burst time</label>
                    <input type="number" id="burst-time" placeholder="1" />
                </div>
                <div class="field">
                    <label for="priority">Priority</label>
                    <input type="number" id="priority" placeholder="1" />
                </div>
                <button id="process-add-btn">Click to add process</button>
            </div>
        </div>

        <!-- Table Queue Section-->
        <div class="table-section">
            <h2>Process queue</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name of process</th>
                        <th>Arrival time</th>
                        <th>Burst time</th>
                        <th>Priority</th>
                    </tr>
                </thead>
                <tbody id="process-tbody">
                </tbody>
            </table>
        </div>


        <!-- Gantt Chart Section-->
        <div class="gantt-chart">
            <h2>Gannt chart</h2>
            <div class="final-gantt" id="final-gantt">

            </div>
        </div>

        <!-- Process Result Section-->
        <div class="process-result">
            <h2>Process results</h2>
            <table>
                <thead>
                    <tr>
                        <th>Process</th>
                        <th>Burst</th>
                        <th>Arrival</th>
                        <th>Start</th>
                        <th>Finish</th>
                        <th>Waiting</th>
                        <th>Turnaround</th>
                    </tr>
                </thead>
                <tbody id="process-result-tbody">

                </tbody>
            </table>
        </div>


    </div>
    <script>
        // Stores processes
        let processes = [];
        let processColors = ['#FF375F', '#30D5C8', '#C9F22C', '#BF5AF2'];
        function getColor(index) {
            if (index < processColors.length) {
                return processColors[index];
            }
            let hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 80%, 60%)`;
        }

        // Add process 
        document.getElementById('process-add-btn').addEventListener('click', function () {
            let name = document.getElementById('process-name').value;
            let arrival = parseInt(document.getElementById('arrival-time').value);
            let burst = parseInt(document.getElementById('burst-time').value);
            let priority = parseInt(document.getElementById('priority').value);

            if (!name || isNaN(arrival) || isNaN(burst) || isNaN(priority)) {
                alert('Please fill in all fields');
                return;
            }
            let color = getColor(processes.length);
            processes.push({ name, arrival, burst, priority, color });

            updateQueueTable();
            updateProcessCount();
            clearInputs();
        });

        // Updates queue table
        function updateQueueTable() {
            let tbody = document.getElementById('process-tbody');
            tbody.innerHTML = '';
            processes.forEach(function (p, index) {
                let row = ` <tr>
                <td><span style ="width:8px;height:8px;border-radius:50%;background:${p.color};display:inline-block;margin-right:6px;"></span>${p.name}</td>
                <td>${p.arrival}</td>
                <td>${p.burst}</td>
                <td>${p.priority}</td>
                <td><button onClick="deleteProcess(${index})" style="background:none;border:none;color:#FF375F;font-size:14px;">x</button></td>
            </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Deletes process
        function deleteProcess(index) {
            processes.splice(index, 1);
            updateQueueTable();
            updateProcessCount();
        }

        // Updates process count in header
        function updateProcessCount() {
            document.getElementById('process-count').textContent = processes.length + ' processes loaded';
        }

        // Clears inputs after adding 
        function clearInputs() {
            document.getElementById('process-name').value = '';
            document.getElementById('arrival-time').value = '';
            document.getElementById('burst-time').value = '';
            document.getElementById('priority').value = '';
        }

        // Runs the simulation
        document.getElementById('run-btn').addEventListener('click', function () {
            if (processes.length == 0) {
                alert('Please add at least one process');
                return;
            }

            let algorithm = document.querySelector('input[name="algorithm"]:checked');
            if (!algorithm) {

                alert('Please select an algorithm');
                return;
            }

            let result;
            switch (algorithm.value) {
                case 'FCFS':
                    result = fcfs([...processes]);
                    break;
                case 'SJF':
                    result = sjf([...processes]);
                    break;
                case 'round-robin':
                    let quantum = parseInt(document.getElementById('quantum').value) || 2;
                    result = roundRobin([...processes], quantum);
                    break;
                case 'Priority':
                    result = priority([...processes]);
                    break;
            }

            createGantt(result.gantt, algorithm.value);
            createResults(result.processes);
        });

        // FCFS algorithm
        function fcfs(processArray) {
            processArray.sort((a, b) => a.arrival - b.arrival);
            let time = 0;
            let gantt = [];
            processArray.forEach(function (p) {
                if (time < p.arrival) time = p.arrival;
                p.start = time;
                p.finish = time + p.burst;
                p.waiting = p.start - p.arrival;
                p.turnaround = p.finish - p.arrival;
                gantt.push({ name: p.name, start: time, end: p.finish, color: p.color });
                time = p.finish;
            });
            return { processes: processArray, gantt };
        }

        // SJF Algorithm
        function sjf(processArray) {
            let time = 0;
            let gantt = [];
            let completed = [];
            let remaining = [...processArray];

            while (remaining.length > 0) {
                let available = remaining.filter(p => p.arrival <= time);
                if (available.length == 0) {
                    time = remaining[0].arrival;
                    available = [remaining[0]];
                }

                available.sort((a, b) => a.burst - b.burst);
                let p = available[0];
                remaining.splice(remaining.indexOf(p), 1);
                p.start = time;
                p.finish = time + p.burst;
                p.waiting = p.start - p.arrival;
                p.turnaround = p.finish - p.arrival;
                gantt.push({ name: p.name, start: time, end: p.finish, color: p.color });
                time = p.finish;
                completed.push(p);
            }
            return { processes: completed, gantt };
        }

        // Round Robin algorithm
        function roundRobin(processArray, quantum) {
            let time = 0;
            let gantt = [];
            let queue = [];
            let remaining = processArray.map(p => ({ ...p, remainingBurst: p.burst }));
            remaining.sort((a,b) => a.arrival - b.arrival);
            let completed = [];
            let i = 0;

            queue.push(remaining[i++]);

            while (queue.length > 0) {
                let p = queue.shift();
                let executionTime = Math.min(p.remainingBurst, quantum);
                gantt.push({ name: p.name, start: time, end: time + executionTime, color: p.color });
                time += executionTime;
                p.remainingBurst -= executionTime;

                while (i < remaining.length && remaining[i].arrival <= time) {
                    queue.push(remaining[i++]);
                }

                if (p.remainingBurst > 0) {
                    queue.push(p);
                }else {
                    p.finish = time;
                    p.waiting = p.finish - p.arrival - p.burst;
                    p.turnaround = p.finish - p.arrival;
                    completed.push(p);
                }
            }
            return {processes: completed, gantt };
        }

        // Priority Algorithm 
        function priority(processArray) {
            let time = 0;
            let gantt = [];
            let completed = [];
            let remaining = [...processArray];

            while (remaining.length > 0) {
                let available = remaining.filter(p => p.arrival <= time);
                if(available.length === 0) {
                    time = remaining[0].arrival;
                    available = [remaining[0]];
                }
                available.sort((a,b) => a.priority - b.priority);
                let p = available[0];
                remaining.splice(remaining.indexOf(p), 1);
                p.start = time;
                p.finish = time + p.burst;
                p.waiting = p.start - p.arrival;
                p.turnaround = p.finish - p.arrival;
                gantt.push({ name: p.name, start: time, end: p.finish, color: p.color });
                time = p.finish;
                completed.push(p);
        }
        return { processes: completed, gantt };
    }

    // Creates Gantt chart
    function createGantt(gantt, algorithmName) {
        let container = document.getElementById('final-gantt');
        let totalTime = gantt[gantt.length - 1].end;

        let barsHTML = '<div class="gantt-bars">';
        let ticksHTML = '<div class="gantt-ticks">';

        if (gantt[0].start > 0) {
            let idleWidth = (gantt[0].start / totalTime) * 100;
            barsHTML += `<div class="gantt-bar" style="width:${idleWidth}%;background:#3A3A3A;">idle</div>`;
            ticksHTML += `<div style="width:${idleWidth}%;font-size:11px;color:#888;">0</div>`;
        }

        gantt.forEach(function(g) {
            let width = ((g.end - g.start) / totalTime) * 100;
            barsHTML += `<div class="gantt-bar" style="width:${width}%;background:${g.color};color:#000;">${g.name}</div>`;
            ticksHTML += `<div style="width:${width}%;font-size:11px;color:#888;">${g.start}</div>`;
        });

        ticksHTML += `<div style="font-size:11px;color:#888;margin-left:auto;">${totalTime}</div>`;
        barsHTML += '</div>';
        ticksHTML += '</div>';

        document.querySelector('.gantt-chart h2').textContent = 'Gantt chart - ' + algorithmName;
        container.innerHTML = barsHTML + ticksHTML;
    }
    // Creates results table 
    function createResults(processArray) {
        let tbody = document.getElementById('process-result-tbody');
        let totalWaiting = 0;
        let totalTurnaround = 0;
        tbody.innerHTML ='';

        processArray.forEach(function(p) {
            totalWaiting += p.waiting;
            totalTurnaround += p.turnaround;
            tbody.innerHTML += `<tr>
                <td><span style="width:8px;height:8px;border-radius:50%;background:${p.color};display:inline-block;margin-right:6px;"></span>${p.name}</td>
                <td>${p.arrival}</td>
                <td>${p.burst}</td>
                <td>${p.start}</td>
                <td>${p.finish}</td>
                <td>${p.waiting}</td>
                <td>${p.turnaround}</td>
                </tr>`;
        });
    }

    </script>
</body>

</html>
